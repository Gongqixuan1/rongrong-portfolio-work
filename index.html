<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>徐溶溶｜Personal Portfolio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Zhi+Mang+Xing&display=swap" rel="stylesheet"><style>.welcome{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;overflow:hidden;color:#fff;background:linear-gradient(135deg,#071a34,#55358c 45%,#ef7898);animation:welcomeOut .9s 4.4s forwards}.welcome-in{text-align:center;position:relative;z-index:3;padding:24px}.welcome-title{font-family:'Zhi Mang Xing','STKaiti','KaiTi',cursive;font-size:clamp(58px,10vw,132px);line-height:1.15;letter-spacing:.04em;text-shadow:0 8px 30px #0003}.type-text{display:inline-block;overflow:hidden;white-space:nowrap;width:0;border-right:3px solid #fff;animation:typing 2.5s steps(10,end) .35s forwards,blink .65s step-end infinite}.welcome-sub{margin-top:20px;font:500 10px 'DM Sans',sans-serif;letter-spacing:.32em;opacity:0;animation:fadeUp .8s 2.6s forwards}.welcome .orb{position:absolute;border-radius:50%;filter:blur(1px);opacity:.9;animation:orb 5s ease-in-out infinite alternate}.welcome .o1{width:34vw;height:34vw;left:-10vw;top:-13vw;background:#ffd86b}.welcome .o2{width:20vw;height:20vw;right:3vw;top:13vh;background:#72d6ff;animation-delay:-1s}.welcome .o3{width:26vw;height:26vw;right:-8vw;bottom:-10vw;background:#ff7a00;animation-delay:-2s}.welcome .o4{width:15vw;height:15vw;left:8vw;bottom:10vh;background:#f5a9c5;animation-delay:-3s}.welcome .spark{position:absolute;font-size:34px;animation:spin 3s linear infinite}.welcome .sp1{left:18%;top:28%}.welcome .sp2{right:23%;top:24%;color:#ffd86b}.welcome .sp3{left:28%;bottom:20%;color:#72d6ff}.welcome .sp4{right:30%;bottom:16%;color:#f5a9c5}@keyframes typing{from{width:0}to{width:3em}}@keyframes blink{50%{border-color:transparent}}@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:.9;transform:none}}@keyframes welcomeOut{to{opacity:0;visibility:hidden;pointer-events:none}}@keyframes orb{to{transform:translate(30px,22px) scale(1.08)}}@keyframes spin{to{transform:rotate(360deg)}}body{margin:0;font-family:'Quicksand','PingFang SC','Microsoft YaHei','PingFang TC',sans-serif}.page{opacity:0;animation:pageIn .8s 4.25s ease forwards}@keyframes pageIn{to{opacity:1}}@media(prefers-reduced-motion:reduce){.welcome{animation:none;opacity:0;visibility:hidden}.page{animation:none;opacity:1}}</style></head><body><div class="welcome"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span><span class="orb o4"></span><span class="spark sp1">✦</span><span class="spark sp2">✦</span><span class="spark sp3">✦</span><span class="spark sp4">✦</span><div class="welcome-in"><div class="welcome-title"><span class="type-text">徐溶溶</span></div><div class="welcome-sub">PERSONAL PORTFOLIO</div></div></div><div class="page" id="page"><p style="padding:60px;font-family:Quicksand">Loading…</p></div><script>const RAW='https://raw.githubusercontent.com/Gongqixuan1/rongrong-portfolio/main/index.html';const ASSET='https://raw.githubusercontent.com/Gongqixuan1/rongrong-portfolio/main/';fetch(RAW).then(r=>r.text()).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html');const page=document.getElementById('page');page.innerHTML='';Array.from(doc.body.childNodes).forEach(n=>page.appendChild(document.importNode(n,true)));doc.querySelectorAll('style').forEach(s=>document.head.appendChild(s.cloneNode(true)));page.querySelectorAll('img').forEach(img=>{const src=img.getAttribute('src');if(src&&!/^(https?:|data:|\/)/.test(src))img.src=ASSET+src});doc.querySelectorAll('script').forEach(old=>{if(old.src){const s=document.createElement('script');s.src=old.src;document.body.appendChild(s)}else{const s=document.createElement('script');s.textContent=old.textContent.replaceAll("'cover-01.jpg'",`'${ASSET}cover-01.jpg'`).replaceAll("'cover-02.jpg'",`'${ASSET}cover-02.jpg'`).replaceAll("'cover-03.jpg'",`'${ASSET}cover-03.jpg'`).replaceAll("'cover-04.jpg'",`'${ASSET}cover-04.jpg'`).replaceAll("'cover-05.jpg'",`'${ASSET}cover-05.jpg'`).replaceAll("'cover-06.jpg'",`'${ASSET}cover-06.jpg'`).replaceAll("'cover-07.jpg'",`'${ASSET}cover-07.jpg'`).replaceAll("'cover-08.jpg'",`'${ASSET}cover-08.jpg'`);document.body.appendChild(s)}})}).catch(e=>{document.getElementById('page').innerHTML='<p style="padding:60px;font-family:Quicksand">加载失败，请刷新页面。</p>';console.error(e)});</script></body></html>
