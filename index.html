<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>徐溶溶｜Personal Portfolio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:'Quicksand','PingFang SC','Microsoft YaHei','PingFang TC',sans-serif;color:#2d2d2d}h1,h2,h3,.title{font-family:'Quicksand','PingFang SC','Microsoft YaHei','PingFang TC',sans-serif;font-weight:700;color:#1e1e1e}.title{font-size:clamp(3rem,7vw,6rem);line-height:1.08;letter-spacing:-.045em}.hero h1{font-family:'Quicksand','PingFang SC','Microsoft YaHei','PingFang TC',sans-serif!important;font-weight:700;letter-spacing:-.055em;color:#1e1e1e!important}.hero .eyebrow,.kicker{font-family:'Quicksand','PingFang SC','Microsoft YaHei','PingFang TC',sans-serif!important;font-size:1.5rem!important;font-weight:500!important;letter-spacing:.01em!important;color:#2d2d2d!important}.hero-sub{font-family:'Quicksand','PingFang SC','Microsoft YaHei','PingFang TC',sans-serif!important;font-size:clamp(1.15rem,2vw,1.65rem)!important;font-weight:500;line-height:1.8;color:#2d2d2d}.hero-note,.time p,.project-card p,.comp p,.story p,.exp-item ul,.skill-box span{font-family:'Quicksand','PingFang SC','Microsoft YaHei','PingFang TC',sans-serif!important;font-size:1rem!important;font-weight:400!important;line-height:1.8!important;color:#4a4a4a!important}.hero-note{margin-bottom:1.5rem}.hero-sub{margin-bottom:.5rem}.time h3,.exp-item h3,.project-card h3,.skill-box strong,.story h3,.comp h3,.works-head h3{font-family:'Quicksand','PingFang SC','Microsoft YaHei','PingFang TC',sans-serif!important;font-weight:700!important;color:#1e1e1e}.time h3{font-size:1.35rem;line-height:1.5}.exp-item h3,.project-card h3{font-size:1.5rem!important;line-height:1.5}.skill-box strong{font-size:1.15rem!important}.story h3,.comp h3{font-size:clamp(2rem,4vw,3rem)!important;line-height:1.2!important}.works-head h3{font-size:clamp(2.5rem,5vw,4rem)!important;line-height:1.2!important}.quote p,.contact h2{font-family:'Quicksand','PingFang SC','Microsoft YaHei','PingFang TC',sans-serif!important;font-weight:700!important}.quote p{font-size:clamp(2.5rem,5vw,4.5rem)!important;line-height:1.35!important}.contact h2{font-size:clamp(4rem,9vw,8rem)!important}.tag,.badge{font-family:'Quicksand','PingFang SC','Microsoft YaHei','PingFang TC',sans-serif!important;font-size:.8rem!important;font-weight:500!important;letter-spacing:.05em!important}.year,.exp-date,.project-no,.story-no,.works-head span,.book-info,.book-count,.contact-label{font-family:'DM Sans','PingFang SC','Microsoft YaHei','PingFang TC',sans-serif!important}.book-info{font-size:.9rem!important}.book-count{font-size:1rem!important}.lb-page{font-family:'DM Sans','PingFang SC','Microsoft YaHei','PingFang TC',sans-serif!important}.section p{margin-bottom:1.5rem}.project-card,.exp-item,.comp,.story,.skill-box,.fact,.time{background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}a{color:inherit}a:hover{color:#FF6B35}.title:after{font-family:'Quicksand',sans-serif}.hero h1{transform:none!important;text-shadow:none!important}.hero .eyebrow,.kicker{transform:none!important}.quote p,.works-head h3,.story h3,.comp h3,.contact h2{transform:none!important}.ambient-layer{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}.ambient-orb{position:absolute;border-radius:50%;filter:blur(1px);opacity:.16;will-change:transform;animation:orbFloat var(--dur) ease-in-out infinite alternate}.ambient-orb.o1{width:170px;height:170px;background:#FF6B35;left:5%;top:18%;--dur:11s}.ambient-orb.o2{width:220px;height:220px;background:#246BFD;right:6%;top:42%;--dur:14s}.ambient-orb.o3{width:130px;height:130px;background:#FF4FA3;left:42%;bottom:8%;--dur:13s}.ambient-orb.o4{width:95px;height:95px;background:#18D9FF;right:30%;top:12%;--dur:17s}@keyframes orbFloat{from{transform:translate3d(-20px,-12px) rotate(0deg) scale(.96)}to{transform:translate3d(28px,25px) rotate(35deg) scale(1.08)}}.ambient-particle{position:absolute;width:7px;height:7px;border:1px solid currentColor;opacity:.34;animation:particleFloat var(--pd) ease-in-out infinite alternate;will-change:transform}.ambient-particle.circle{border-radius:50%}.ambient-particle.cross{width:11px;height:11px;border:0}.ambient-particle.cross:before,.ambient-particle.cross:after{content:'';position:absolute;background:currentColor;left:50%;top:0;transform:translateX(-50%);width:1px;height:100%}.ambient-particle.cross:after{transform:translateX(-50%) rotate(90deg)}@keyframes particleFloat{from{transform:translate3d(0,0,0) rotate(0deg)}to{transform:translate3d(var(--dx),var(--dy),0) rotate(180deg)}}.page-enter{animation:pageEnter .85s cubic-bezier(.2,.75,.2,1) both}@keyframes pageEnter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}.lightbox{transition:opacity .35s ease,visibility .35s ease,backdrop-filter .35s ease}.lightbox.open #lightboxImg{animation:lightboxIn .45s cubic-bezier(.2,.75,.2,1) both}@keyframes lightboxIn{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}.confetti{position:fixed;z-index:120000;top:-30px;animation:fall linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}@media(max-width:700px){.title{font-size:clamp(3rem,15vw,5rem)}.hero h1{font-size:clamp(4rem,20vw,7rem)!important}.hero-sub{font-size:1.1rem!important}.hero-note,.time p,.project-card p,.comp p,.story p,.exp-item ul,.skill-box span{font-size:.95rem!important}.quote p{font-size:clamp(2.4rem,12vw,4rem)!important}.ambient-orb{opacity:.1}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}</style></head><body><div class="ambient-layer" aria-hidden="true"><i class="ambient-orb o1"></i><i class="ambient-orb o2"></i><i class="ambient-orb o3"></i><i class="ambient-orb o4"></i></div><div class="cursor-dot"></div><div class="cursor-trail"></div><main id="original"></main><script>const RAW='https://raw.githubusercontent.com/Gongqixuan1/rongrong-portfolio/main/index.html';const ASSET='https://raw.githubusercontent.com/Gongqixuan1/rongrong-portfolio/main/';let sourceDoc;fetch(RAW).then(r=>r.text()).then(html=>{sourceDoc=new DOMParser().parseFromString(html,'text/html');const body=sourceDoc.body;document.getElementById('original').replaceWith(...Array.from(body.childNodes).map(n=>document.importNode(n,true)));document.querySelectorAll('img').forEach(img=>{const src=img.getAttribute('src');if(src&&!/^(https?:|data:|\/)/.test(src))img.src=ASSET+src});sourceDoc.querySelectorAll('style').forEach(old=>{const s=document.createElement('style');s.textContent=old.textContent;document.head.appendChild(s)});const scripts=[...sourceDoc.querySelectorAll('script')];scripts.forEach(old=>{if(!old.src){const s=document.createElement('script');s.textContent=old.textContent.replaceAll("'cover-01.jpg'",`'${ASSET}cover-01.jpg'`).replaceAll("'cover-02.jpg'",`'${ASSET}cover-02.jpg'`).replaceAll("'cover-03.jpg'",`'${ASSET}cover-03.jpg'`).replaceAll("'cover-04.jpg'",`'${ASSET}cover-04.jpg'`).replaceAll("'cover-05.jpg'",`'${ASSET}cover-05.jpg'`).replaceAll("'cover-06.jpg'",`'${ASSET}cover-06.jpg'`).replaceAll("'cover-07.jpg'",`'${ASSET}cover-07.jpg'`).replaceAll("'cover-08.jpg'",`'${ASSET}cover-08.jpg'`);document.body.appendChild(s)}});requestAnimationFrame(initUX)}).catch(e=>{document.body.innerHTML='<p style="padding:60px;font:20px Quicksand">加载失败，请刷新页面。</p>';console.error(e)});function initUX(){document.body.classList.add('page-enter');setupAmbientParticles();const dot=document.querySelector('.cursor-dot'),trail=document.querySelector('.cursor-trail');let tx=0,ty=0,cx=0,cy=0;document.addEventListener('mousemove',e=>{tx=e.clientX;ty=e.clientY;dot.style.left=tx+'px';dot.style.top=ty+'px'});(function loop(){cx+=(tx-cx)*.16;cy+=(ty-cy)*.16;trail.style.left=cx+'px';trail.style.top=cy+'px';requestAnimationFrame(loop)})();document.querySelectorAll('a,button,.project-card,.exp-item,.comp,.story,.skill-box,.fact,.tag,.book-stage img').forEach(el=>{el.addEventListener('mouseenter',()=>document.body.classList.add('cursor-hot'));el.addEventListener('mouseleave',()=>document.body.classList.remove('cursor-hot'))});const revealTargets=document.querySelectorAll('.section,.works,.project-grid,.competition-grid,.stories,.experience,.skills-layout,.timeline,.contact');revealTargets.forEach(el=>{el.classList.add('reveal');if(el.matches('.project-grid,.competition-grid,.stories,.experience,.skills-layout,.timeline'))el.classList.add('stagger')});const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});revealTargets.forEach(el=>io.observe(el));const tiltTargets=document.querySelectorAll('.project-card,.exp-item,.comp,.story,.skill-box');tiltTargets.forEach(card=>{card.classList.add('tilt');card.addEventListener('mousemove',e=>{if(matchMedia('(pointer:coarse)').matches)return;const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform=`perspective(900px) rotateX(${(-y*5).toFixed(2)}deg) rotateY(${(x*5).toFixed(2)}deg) translateY(-6px)`});card.addEventListener('mouseleave',()=>card.style.transform='')});setupLightbox();setupConfetti()}function setupAmbientParticles(){const layer=document.querySelector('.ambient-layer');if(!layer)return;const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;if(reduce)return;const chars=['✦','＋','·','◇','○'];for(let i=0;i<28;i++){const p=document.createElement('i');p.className='ambient-particle '+(Math.random()>.55?'cross':'circle');if(p.classList.contains('cross'))p.textContent='+';p.style.left=Math.random()*100+'%';p.style.top=Math.random()*100+'%';p.style.color=['#FF6B35','#246BFD','#FF4FA3','#18D9FF','#C8FF3D'][i%5];p.style.setProperty('--pd',(8+Math.random()*12)+'s');p.style.setProperty('--dx',(-30+Math.random()*60)+'px');p.style.setProperty('--dy',(-25+Math.random()*50)+'px');p.style.animationDelay=(-Math.random()*10)+'s';layer.appendChild(p)}}function setupLightbox(){const img=document.getElementById('portfolioImg');if(!img)return;const works=['cover-01.jpg','cover-02.jpg','cover-03.jpg','cover-04.jpg','cover-05.jpg','cover-06.jpg','cover-07.jpg','cover-08.jpg'];let index=0;const oldNext=document.getElementById('nextBtn'),oldPrev=document.getElementById('prevBtn');if(oldNext)oldNext.addEventListener('click',()=>index=(index+1)%works.length);if(oldPrev)oldPrev.addEventListener('click',()=>index=(index-1+works.length)%works.length);const box=document.getElementById('lightbox');if(!box)return;const oldClose=box.querySelector('button');if(oldClose)oldClose.style.display='none';let nav=document.createElement('div');nav.className='lb-nav';let page=document.createElement('div');page.className='lb-page';let close=document.createElement('button');close.className='lb-close';close.textContent='×';box.append(close,nav,page);works.forEach((w,i)=>{const t=document.createElement('img');t.className='lb-thumb';t.src=ASSET+w;t.onclick=()=>{index=i;render()};nav.appendChild(t)});function render(){document.getElementById('lightboxImg').src=ASSET+works[index];nav.querySelectorAll('.lb-thumb').forEach((t,i)=>t.classList.toggle('active',i===index));page.textContent=`${index+1} / ${works.length}`}img.addEventListener('click',()=>{box.classList.add('open');render()});close.onclick=()=>box.classList.remove('open');document.addEventListener('keydown',e=>{if(!box.classList.contains('open'))return;if(e.key==='ArrowRight'){index=(index+1)%works.length;render()}if(e.key==='ArrowLeft'){index=(index-1+works.length)%works.length;render()}if(e.key==='Escape')box.classList.remove('open')})}function setupConfetti(){let hits=0,last=0;document.addEventListener('keydown',e=>{if(e.key.toLowerCase()!=='r')return;const now=Date.now();if(now-last>1800)hits=0;last=now;hits++;if(hits===3){hits=0;for(let i=0;i<70;i++){const el=document.createElement('span');el.className='confetti';el.textContent=['🎉','✦','◆','●','★'][Math.floor(Math.random()*5)];el.style.left=Math.random()*100+'vw';el.style.fontSize=12+Math.random()*18+'px';el.style.animationDuration=2.5+Math.random()*2.5+'s';el.style.color=['#FF6B35','#246BFD','#FF4FA3','#C8FF3D','#18D9FF'][Math.floor(Math.random()*5)];document.body.appendChild(el);setTimeout(()=>el.remove(),5500)}}})}</script></body></html>
