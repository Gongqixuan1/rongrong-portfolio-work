<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>徐溶溶｜Personal Portfolio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--cursor:#FF6B35;--blue:#246BFD;--violet:#7957FF;--pink:#FF4FA3;--cyan:#18D9FF;--lime:#C8FF3D;--ink:#10152D;--muted:#667085}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:Inter,'Noto Sans SC',sans-serif;background:linear-gradient(-45deg,#fff7f1,#eef7ff,#f6f0ff,#edffff,#fff7f1);background-size:500% 500%;animation:bgFlow 15s ease infinite;overflow-x:hidden}body:before{content:'';position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 10% 15%,#FF6B3530 0 10%,transparent 28%),radial-gradient(circle at 90% 30%,#246BFD25 0 12%,transparent 30%),radial-gradient(circle at 45% 90%,#FF4FA320 0 12%,transparent 32%);pointer-events:none}@keyframes bgFlow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}.cursor-dot,.cursor-trail{position:fixed;left:0;top:0;border-radius:50%;pointer-events:none;z-index:100000;transform:translate(-50%,-50%)}.cursor-dot{width:12px;height:12px;background:#FF6B35;box-shadow:0 0 16px #FF6B3588;transition:width .18s,height .18s,background .18s,box-shadow .18s}.cursor-trail{width:30px;height:30px;border:1px solid #FF6B3566;background:#FF6B3512;transition:width .25s,height .25s,background .25s,border-color .25s}.cursor-hot .cursor-dot{width:24px;height:24px;background:#ff8a5e;box-shadow:0 0 30px #FF6B35}.cursor-hot .cursor-trail{width:54px;height:54px;background:#FF6B351c;border-color:#FF6B35aa}@media(pointer:coarse){.cursor-dot,.cursor-trail{display:none}}.reveal{opacity:0;transform:translateY(40px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}.reveal.in{opacity:1;transform:none}.reveal.stagger>*{opacity:0;transform:translateY(35px);transition:opacity .65s ease,transform .65s ease}.reveal.stagger.in>*{opacity:1;transform:none}.reveal.stagger.in>*:nth-child(1){transition-delay:.05s}.reveal.stagger.in>*:nth-child(2){transition-delay:.15s}.reveal.stagger.in>*:nth-child(3){transition-delay:.25s}.reveal.stagger.in>*:nth-child(4){transition-delay:.35s}.reveal.stagger.in>*:nth-child(5){transition-delay:.45s}.reveal.stagger.in>*:nth-child(6){transition-delay:.55s}.tilt{transform-style:preserve-3d;transition:transform .2s ease,box-shadow .2s ease!important}.tilt:hover{box-shadow:0 28px 60px #10152d25!important}.magnetic{transition:transform .25s ease}.section{position:relative}.section>.wrap{position:relative}.title,h1,h2,h3{letter-spacing:-.035em}.title{font-family:'Space Grotesk','Noto Sans SC',sans-serif;font-weight:800}.portfolio{isolation:isolate}.portfolio:before{content:'';position:absolute;inset:-30%;z-index:-1;background:conic-gradient(from 90deg,#FF6B35,#FF4FA3,#7957FF,#18D9FF,#C8FF3D,#FF6B35);filter:blur(70px);opacity:.18;animation:spin 16s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.book-stage img{border-radius:12px;box-shadow:inset 0 0 0 1px #fff4,0 25px 70px #0008!important}.lightbox{background:rgba(0,0,0,.92)!important;backdrop-filter:blur(12px)}.lb-nav{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:center;gap:8px;padding:0 80px;overflow:auto;z-index:3}.lb-thumb{width:58px;height:72px;object-fit:cover;border:2px solid transparent;border-radius:7px;opacity:.55;cursor:pointer;flex:none;transition:.2s}.lb-thumb:hover,.lb-thumb.active{opacity:1;border-color:#FF6B35;transform:translateY(-5px)}.lb-page{position:absolute;right:25px;bottom:25px;color:#fff;font:700 12px 'Space Grotesk';letter-spacing:.12em}.lb-close{position:absolute;right:24px;top:20px;z-index:5;width:48px;height:48px;border:1px solid #fff5;border-radius:50%;background:#ffffff12;color:#fff;font-size:25px;cursor:pointer}.confetti{position:fixed;z-index:120000;top:-30px;animation:fall linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}@media(max-width:700px){.reveal{transform:translateY(25px)}.lb-nav{padding:0 50px}.lb-thumb{width:44px;height:56px}.lb-close{width:42px;height:42px;right:14px;top:14px}.section{overflow:hidden}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style></head><body>
<div class="cursor-dot"></div><div class="cursor-trail"></div>
<main id="original"></main>
<script>
const RAW='https://raw.githubusercontent.com/Gongqixuan1/rongrong-portfolio/main/index.html';
const ASSET='https://raw.githubusercontent.com/Gongqixuan1/rongrong-portfolio/main/';
let sourceDoc;
fetch(RAW).then(r=>r.text()).then(html=>{sourceDoc=new DOMParser().parseFromString(html,'text/html');const body=sourceDoc.body;document.getElementById('original').replaceWith(...Array.from(body.childNodes).map(n=>document.importNode(n,true)));document.querySelectorAll('img').forEach(img=>{const src=img.getAttribute('src');if(src&&!/^(https?:|data:|\/)/.test(src))img.src=ASSET+src});sourceDoc.querySelectorAll('style').forEach(old=>{const s=document.createElement('style');s.textContent=old.textContent;document.head.appendChild(s)});const scripts=[...sourceDoc.querySelectorAll('script')];scripts.forEach(old=>{if(!old.src){const s=document.createElement('script');s.textContent=old.textContent.replaceAll("'cover-01.jpg'",`'${ASSET}cover-01.jpg'`).replaceAll("'cover-02.jpg'",`'${ASSET}cover-02.jpg'`).replaceAll("'cover-03.jpg'",`'${ASSET}cover-03.jpg'`).replaceAll("'cover-04.jpg'",`'${ASSET}cover-04.jpg'`).replaceAll("'cover-05.jpg'",`'${ASSET}cover-05.jpg'`).replaceAll("'cover-06.jpg'",`'${ASSET}cover-06.jpg'`).replaceAll("'cover-07.jpg'",`'${ASSET}cover-07.jpg'`).replaceAll("'cover-08.jpg'",`'${ASSET}cover-08.jpg'`);document.body.appendChild(s)}});requestAnimationFrame(initUX)}).catch(e=>{document.body.innerHTML='<p style="padding:60px;font:20px Inter">加载失败，请刷新页面。</p>';console.error(e)});
function initUX(){
const dot=document.querySelector('.cursor-dot'),trail=document.querySelector('.cursor-trail');let tx=0,ty=0,cx=0,cy=0;document.addEventListener('mousemove',e=>{tx=e.clientX;ty=e.clientY;dot.style.left=tx+'px';dot.style.top=ty+'px'});(function loop(){cx+=(tx-cx)*.16;cy+=(ty-cy)*.16;trail.style.left=cx+'px';trail.style.top=cy+'px';requestAnimationFrame(loop)})();document.querySelectorAll('a,button,.project-card,.exp-item,.comp,.story,.skill-box,.fact,.tag,.book-stage img').forEach(el=>{el.addEventListener('mouseenter',()=>document.body.classList.add('cursor-hot'));el.addEventListener('mouseleave',()=>document.body.classList.remove('cursor-hot'))});
const revealTargets=document.querySelectorAll('.section,.works,.project-grid,.competition-grid,.stories,.experience,.skills-layout,.timeline,.contact');revealTargets.forEach(el=>{el.classList.add('reveal');if(el.matches('.project-grid,.competition-grid,.stories,.experience,.skills-layout,.timeline'))el.classList.add('stagger')});const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});revealTargets.forEach(el=>io.observe(el));
const tiltTargets=document.querySelectorAll('.project-card,.exp-item,.comp,.story,.skill-box');tiltTargets.forEach(card=>{card.classList.add('tilt');card.addEventListener('mousemove',e=>{if(matchMedia('(pointer:coarse)').matches)return;const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform=`perspective(900px) rotateX(${(-y*5).toFixed(2)}deg) rotateY(${(x*5).toFixed(2)}deg) translateY(-6px)`});card.addEventListener('mouseleave',()=>card.style.transform='')});
setupLightbox();setupConfetti();
}
function setupLightbox(){const img=document.getElementById('portfolioImg');if(!img)return;const works=['cover-01.jpg','cover-02.jpg','cover-03.jpg','cover-04.jpg','cover-05.jpg','cover-06.jpg','cover-07.jpg','cover-08.jpg'];let index=0;const oldNext=document.getElementById('nextBtn'),oldPrev=document.getElementById('prevBtn');if(oldNext)oldNext.addEventListener('click',()=>index=(index+1)%works.length);if(oldPrev)oldPrev.addEventListener('click',()=>index=(index-1+works.length)%works.length);const box=document.getElementById('lightbox');if(!box)return;const oldClose=box.querySelector('button');if(oldClose)oldClose.style.display='none';let nav=document.createElement('div');nav.className='lb-nav';let page=document.createElement('div');page.className='lb-page';let close=document.createElement('button');close.className='lb-close';close.textContent='×';box.append(close,nav,page);works.forEach((w,i)=>{const t=document.createElement('img');t.className='lb-thumb';t.src=ASSET+w;t.onclick=()=>{index=i;render()};nav.appendChild(t)});function render(){document.getElementById('lightboxImg').src=ASSET+works[index];nav.querySelectorAll('.lb-thumb').forEach((t,i)=>t.classList.toggle('active',i===index));page.textContent=`${index+1} / ${works.length}`}img.addEventListener('click',()=>{box.classList.add('open');render()});close.onclick=()=>box.classList.remove('open');document.addEventListener('keydown',e=>{if(!box.classList.contains('open'))return;if(e.key==='ArrowRight'){index=(index+1)%works.length;render()}if(e.key==='ArrowLeft'){index=(index-1+works.length)%works.length;render()}if(e.key==='Escape')box.classList.remove('open')})}
function setupConfetti(){let hits=0,last=0;document.addEventListener('keydown',e=>{if(e.key.toLowerCase()!=='r')return;const now=Date.now();if(now-last>1800)hits=0;last=now;hits++;if(hits===3){hits=0;for(let i=0;i<70;i++){const el=document.createElement('span');el.className='confetti';el.textContent=['🎉','✦','◆','●','★'][Math.floor(Math.random()*5)];el.style.left=Math.random()*100+'vw';el.style.fontSize=12+Math.random()*18+'px';el.style.animationDuration=2.5+Math.random()*2.5+'s';el.style.color=['#FF6B35','#246BFD','#FF4FA3','#C8FF3D','#18D9FF'][Math.floor(Math.random()*5)];document.body.appendChild(el);setTimeout(()=>el.remove(),5500)}}})}
</script></body></html>
